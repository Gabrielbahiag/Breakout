[project]
name = "breakout"
version = "0.0.1"
description = "Detector de viralização de vídeos curtos — algoritmo (decolagem) + dados (elementos)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "typer>=0.12",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Instale com:  pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "time-machine>=2.14",
    "respx>=0.21",
    "syrupy>=4.6",
]
# Produção (coletor no GitHub Actions): fala com a API real e com o Turso.
prod = [
    "google-api-python-client>=2.120",
    "libsql-experimental>=0.0.40",
]
# Motores completos (fases seguintes).
engines = [
    "ruptures>=1.1",
    "river>=0.21",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "streamlit>=1.33",
]

[project.scripts]
breakout = "breakout.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"breakout.storage" = ["*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra -m 'not network'"
markers = [
    "unit: testes de unidade rápidos e determinísticos",
    "integration: pipeline costurado, ainda offline (fakes)",
    "network: toca a API real (desligado por padrão)",
    "slow: demorado",
    "benchmark: mede qualidade de detector (earliness x acurácia)",
]
