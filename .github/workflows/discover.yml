name: discover

# Semeia a carteira de vídeos.
#   - Disparo manual (workflow_dispatch) com `query` preenchido: busca UM
#     termo avulso — você decide hora e cota gasta (100 unidades/chamada).
#   - Disparo manual SEM `query`, ou cron diário (Fase 7): roda `discover-all`
#     sobre os nichos ATIVOS em `discover_topics` — lista editável pelo
#     dashboard (ou por SQL direto), sem precisar mexer neste workflow pra
#     trocar de nicho/idioma.
on:
  workflow_dispatch:
    inputs:
      query:
        description: "termo de busca avulso (deixe vazio pra rodar discover-all sobre discover_topics)"
        required: false
      max_results:
        description: "máximo de vídeos a semear (só usado com `query`)"
        required: false
        default: "50"
  schedule:
    - cron: "17 3 * * *"   # diário, fora do pico (mesma lógica do :23 do collect)

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências de produção
        run: pip install -e ".[prod]"
      - name: Descobrir um termo avulso
        if: github.event_name == 'workflow_dispatch' && inputs.query != ''
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -m breakout discover --query "${{ inputs.query }}" --max-results ${{ inputs.max_results }}
      - name: Descobrir todos os nichos ativos (discover_topics)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.query == '')
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -m breakout discover-all
