name: discover

# Semeia a carteira de vídeos. Disparo manual só — descobrir gasta cota de
# search (100 unidades/chamada), então não roda em cron: quem decide quando
# gastar é o dev, na aba Actions > discover > Run workflow.
on:
  workflow_dispatch:
    inputs:
      query:
        description: "termo de busca"
        required: true
      max_results:
        description: "máximo de vídeos a semear"
        required: false
        default: "50"

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências de produção
        run: pip install -e ".[prod]"
      - name: Descobrir e semear
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -m breakout discover --query "${{ inputs.query }}" --max-results ${{ inputs.max_results }}
